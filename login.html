<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión • Scrakk</title>
  <link rel="icon" type="image/png" href="assets/icons/logo/logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .login-page {
      max-width: 480px;
      margin: 140px auto 80px;
      padding: 0 24px;
    }
    .login-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .login-header h1 {
      font-size: 32px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-header p {
      color: rgba(255,255,255,0.6);
      font-size: 15px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-field label {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-weight: 500;
    }
    .form-field input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      transition: all 0.2s ease;
    }
    .form-field input:focus {
      outline: none;
      border-color: rgba(139,0,255,0.5);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(139,0,255,0.1);
    }
    .form-field input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .login-error {
      display: none;
      background: rgba(248,81,73,0.15);
      border: 1px solid rgba(248,81,73,0.3);
      color: #f85149;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
    }
    .login-error.active {
      display: block;
    }
    .login-button {
      position: relative;
      background: linear-gradient(135deg, #8b00ff, #6d00d9);
      border: none;
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s ease;
      margin-top: 8px;
    }
    .login-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    .login-button:hover::before {
      left: 100%;
    }
    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(139,0,255,0.4);
    }
    .login-button:active {
      transform: translateY(0);
    }
    .login-button span {
      position: relative;
      z-index: 1;
    }
    .login-footer {
      margin-top: 32px;
      text-align: center;
    }
    .login-footer p {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }
    .login-footer a {
      color: #8b00ff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .login-footer a:hover {
      color: #a855f7;
    }
    @media (max-width: 640px) {
      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="nav-container">
      <div class="logo">
        <a href="home.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px;">
          <img src="assets/icons/logo.png" alt="Scrakk Logo">
          <div class="typing-container">
            <span class="typing-text"></span>
            <span class="cursor"></span>
          </div>
        </a>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="home.html#descargar">Descargar</a>
        <a href="home.html#docs">Docs</a>
        <a href="home.html#desarrollo">Desarrollo</a>
        <a href="proyectos.html">Proyectos Publicos</a>
        <a href="home.html#compras">Compras</a>
        <a href="login.html" class="nav-button"><span>Iniciar Sesión</span></a>
      </div>
    </div>
  </nav>

  <!-- Navbar JavaScript -->
  <script src="navbar.js"></script>

  <main class="login-page">
    <div class="login-card">
      <div class="login-header">
        <h1>Iniciar Sesión</h1>
        <p>Ingresa tu Scrakk ID y nombre de usuario para acceder</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="login-error" id="loginError">
          Credenciales incorrectas
        </div>

        <div class="form-field">
          <label for="scrakkId">Scrakk ID</label>
          <input 
            type="text" 
            id="scrakkId" 
            name="scrakkId"
            placeholder="scrakk-id-0000-0000-0000"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-field">
          <label for="username">Nombre de Usuario</label>
          <input 
            type="text" 
            id="username" 
            name="username"
            placeholder="tu_usuario"
            autocomplete="username"
            required
          />
        </div>

        <button type="submit" class="login-button">
          <span>Entrar</span>
        </button>
      </form>

      <div class="login-footer">
        <p>¿No tienes una cuenta? Crea una desde el editor</p>
      </div>
    </div>
  </main>

  <!-- Configuración de Supabase -->
  <script src="supabase-config.js"></script>

  <script>

    // ========================================
    // SISTEMA DE LOGIN
    // ========================================
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const scrakkId = document.getElementById('scrakkId').value.trim();
      const username = document.getElementById('username').value.trim();

      // Limpiar error previo
      loginError.classList.remove('active');

      if (!scrakkId || !username) {
        loginError.textContent = 'Por favor completa todos los campos';
        loginError.classList.add('active');
        return;
      }

      try {
        // Buscar usuario en Supabase
        const { data: user, error } = await supabase
          .from('users')
          .select('id, username, scrakk_id, display_name, avatar_url')
          .eq('scrakk_id', scrakkId)
          .eq('username', username)
          .single();

        if (error || !user) {
          loginError.textContent = 'Credenciales incorrectas. Verifica tu Scrakk ID y nombre de usuario.';
          loginError.classList.add('active');
          return;
        }

        // Guardar sesión
        localStorage.setItem('scrakk_user', JSON.stringify(user));

        // Redirigir a proyectos
        window.location.href = 'proyectos.html';

      } catch (err) {
        console.error('Error al iniciar sesión:', err);
        loginError.textContent = 'Error al conectar con el servidor. Intenta de nuevo.';
        loginError.classList.add('active');
      }
    });

    // Verificar si ya hay sesión activa
    const userData = localStorage.getItem('scrakk_user');
    if (userData) {
      window.location.href = 'proyectos.html';
    }
  </script>
</body>
</html>
