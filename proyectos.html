<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos Públicos • Scrakk</title>
  <link rel="icon" type="image/png" href="assets/icons/logo/logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Página de Proyectos: estilos mínimos para componer con el tema existente */
    .projects-page {
      max-width: 1600px;
      margin: 100px auto 80px;
      padding: 0 24px;
    }
    .projects-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .projects-title {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .projects-title h1 {
      font-size: 42px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .projects-title p {
      color: rgba(255,255,255,0.7);
    }
    .projects-search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 280px;
    }
    .projects-search-box input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.9);
      font: inherit;
    }
    .projects-grid {
      display: grid;
      /* Columnas de ancho fijo para que el tamaño NO cambie según la cantidad */
      grid-template-columns: repeat(auto-fill, minmax(320px, 320px));
      gap: 24px;
      margin-top: 10px;
      justify-content: start; /* alinear a la izquierda */
      justify-items: start;   /* asegurar items alineados a la izquierda */
    }
    .project-card {
      position: relative;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      display: flex;
      flex-direction: column;
      height: 380px; /* altura uniforme para todas las cards */
      width: 320px;  /* ancho uniforme para todas las cards */
      max-width: 100%;
    }
    .project-card:hover {
      transform: translateY(-4px);
      border-color: rgba(139,0,255,0.45);
      box-shadow: 0 20px 60px rgba(139, 0, 255, 0.12);
    }
    .project-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, rgba(139,0,255,0.2), rgba(255,255,255,0.06));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .project-thumb img {
      width: 60%;
      height: auto;
      opacity: 0.85;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
    }
    .project-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1 1 auto; /* ocupa el alto restante para uniformidad */
    }
    .project-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
    }
    .project-desc {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 12px;
      min-height: 40px;
      overflow: hidden; /* evita que textos largos rompan la altura */
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .project-tag {
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(139,0,255,0.15);
      color: #a855f7;
      border: 1px solid rgba(139,0,255,0.25);
    }
    .projects-empty {
      display: none;
      text-align: center;
      color: rgba(255,255,255,0.7);
      padding: 40px 0;
    }
    /* User Menu */
    .user-menu {
      position: relative;
      display: none;
    }
    .user-menu.active {
      display: block;
    }
    .user-button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(139,0,255,0.15);
      border: 1px solid rgba(139,0,255,0.3);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .user-button:hover {
      background: rgba(139,0,255,0.25);
    }
    .user-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(20,20,20,0.98);
      border: 1px solid rgba(139,0,255,0.3);
      border-radius: 8px;
      padding: 8px;
      min-width: 200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .user-dropdown.active {
      display: block;
    }
    .user-dropdown-item {
      padding: 10px 12px;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      font-size: 14px;
    }
    .user-dropdown-item:hover {
      background: rgba(139,0,255,0.15);
      color: #fff;
    }
    .user-dropdown-divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 8px 0;
    }
    @media (max-width: 640px) {
      .projects-header { flex-direction: column; align-items: stretch; }
      .projects-search-box { width: 100%; min-width: 0; }
      /* En pantallas pequeñas, permitir 1 columna al 100% */
      .projects-grid { grid-template-columns: 1fr; }
      .project-card { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="nav-container">
      <div class="logo">
        <a href="home.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px;">
          <img src="assets/icons/logo.png" alt="Scrakk Logo">
          <div class="typing-container">
            <span class="typing-text"></span>
            <span class="cursor"></span>
          </div>
        </a>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="home.html#descargar">Descargar</a>
        <a href="home.html#docs">Docs</a>
        <a href="home.html#desarrollo">Desarrollo</a>
        <a href="proyectos.html">Proyectos Publicos</a>
        <a href="home.html#compras">Compras</a>
        <a href="login.html" class="nav-button" id="loginBtn"><span>Iniciar Sesión</span></a>
        <div class="user-menu" id="userMenu">
          <button class="user-button" id="userButton">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span id="userName">Usuario</span>
          </button>
          <div class="user-dropdown" id="userDropdown">
            <div class="user-dropdown-item" id="myProjectsTab">Mis Proyectos</div>
            <div class="user-dropdown-item" id="allProjectsTab">Todos los Proyectos</div>
            <div class="user-dropdown-divider"></div>
            <div class="user-dropdown-item" id="logoutBtn">Cerrar Sesión</div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Navbar JavaScript -->
  <script src="navbar.js"></script>

  <main class="projects-page">
    <div class="projects-header">
      <div class="projects-title">
        <h1>Proyectos Públicos</h1>
        <p>Explora y busca proyectos compartidos por la comunidad.</p>
      </div>
      <label class="projects-search-box" aria-label="Buscar proyectos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: rgba(255,255,255,0.6);">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="projectSearch" type="text" placeholder="Buscar por nombre o etiqueta..." />
      </label>
    </div>

    <div id="projectsGrid" class="projects-grid">
      <!-- Los proyectos se cargarán dinámicamente desde Supabase -->
    </div>

    <div id="projectsEmpty" class="projects-empty">No se encontraron proyectos.</div>
  </main>


  <!-- Configuración de Supabase -->
  <script src="supabase-config.js"></script>
  
  <script>
    // ========================================
    // SISTEMA DE AUTENTICACIÓN
    // ========================================
    let currentUser = null;
    let currentView = 'all'; // 'all' o 'my'

    // Cargar usuario desde localStorage
    function loadUser() {
      const userData = localStorage.getItem('scrakk_user');
      if (userData) {
        currentUser = JSON.parse(userData);
        updateUIForLoggedInUser();
      }
    }

    function updateUIForLoggedInUser() {
      document.getElementById('loginBtn').style.display = 'none';
      document.getElementById('userMenu').classList.add('active');
      document.getElementById('userName').textContent = currentUser.username;
    }

    function updateUIForLoggedOutUser() {
      document.getElementById('loginBtn').style.display = 'block';
      document.getElementById('userMenu').classList.remove('active');
      currentUser = null;
      currentView = 'all';
    }


    // Logout
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      localStorage.removeItem('scrakk_user');
      updateUIForLoggedOutUser();
      document.getElementById('userDropdown').classList.remove('active');
      if (currentView === 'my') {
        currentView = 'all';
        loadProjects();
      }
    });

    // Toggle user dropdown
    document.getElementById('userButton')?.addEventListener('click', () => {
      document.getElementById('userDropdown').classList.toggle('active');
    });

    // Cerrar dropdown al hacer click fuera
    document.addEventListener('click', (e) => {
      const userMenu = document.getElementById('userMenu');
      if (userMenu && !userMenu.contains(e.target)) {
        document.getElementById('userDropdown').classList.remove('active');
      }
    });

    // Ver mis proyectos
    document.getElementById('myProjectsTab')?.addEventListener('click', () => {
      currentView = 'my';
      document.getElementById('userDropdown').classList.remove('active');
      loadProjects();
    });

    // Ver todos los proyectos
    document.getElementById('allProjectsTab')?.addEventListener('click', () => {
      currentView = 'all';
      document.getElementById('userDropdown').classList.remove('active');
      loadProjects();
    });

    // Cargar usuario al iniciar
    loadUser();
  </script>
  
  <script>

    // ========================================
    // CARGA DE PROYECTOS DESDE SUPABASE
    // ========================================
    let allProjects = [];
    
    async function loadProjects() {
      try {
        const grid = document.getElementById('projectsGrid');
        const empty = document.getElementById('projectsEmpty');
        
        // Mostrar mensaje de carga
        grid.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center; grid-column: 1/-1; padding: 40px;">Cargando proyectos...</p>';
        
        // Construir query según la vista actual
        let query = supabase
          .from('public_projects')
          .select(`
            id,
            title,
            description,
            author_name,
            tags,
            views_count,
            downloads_count,
            likes_count,
            download_link,
            project_type,
            created_at,
            project_images(image_base64, is_thumbnail)
          `);
        
        // Filtrar según la vista
        if (currentView === 'my' && currentUser) {
          query = query.eq('user_id', currentUser.id);
        } else {
          query = query.eq('is_public', true);
        }
        
        const { data: projects, error } = await query.order('created_at', { ascending: false });
        
        if (error) {
          console.error('Error al cargar proyectos:', error);
          grid.innerHTML = '<p style="color: #f85149; text-align: center; grid-column: 1/-1; padding: 40px;">Error al cargar proyectos. Por favor, intenta de nuevo.</p>';
          return;
        }
        
        allProjects = projects || [];
        
        if (allProjects.length === 0) {
          grid.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        
        // Renderizar proyectos
        renderProjects(allProjects);
        empty.style.display = 'none';
        
      } catch (err) {
        console.error('Error:', err);
        document.getElementById('projectsGrid').innerHTML = '<p style="color: #f85149; text-align: center; grid-column: 1/-1; padding: 40px;">Error al cargar proyectos.</p>';
      }
    }
    
    function renderProjects(projects) {
      const grid = document.getElementById('projectsGrid');
      
      if (projects.length === 0) {
        grid.innerHTML = '';
        document.getElementById('projectsEmpty').style.display = 'block';
        return;
      }
      
      document.getElementById('projectsEmpty').style.display = 'none';
      
      grid.innerHTML = projects.map(project => {
        // Obtener thumbnail (la primera imagen con is_thumbnail = true, o la primera imagen disponible)
        let thumbnailSrc = 'assets/icons/logo/logo.png'; // Por defecto
        if (project.project_images && project.project_images.length > 0) {
          const thumbnail = project.project_images.find(img => img.is_thumbnail);
          if (thumbnail && thumbnail.image_base64) {
            thumbnailSrc = thumbnail.image_base64;
          } else if (project.project_images[0].image_base64) {
            thumbnailSrc = project.project_images[0].image_base64;
          }
        }
        
        // Normalizar tags
        const tags = project.tags || [];
        const tagsStr = tags.join(', ');
        
        // Generar gradiente aleatorio para el fondo
        const gradients = [
          'linear-gradient(135deg, rgba(139,0,255,0.2), rgba(255,255,255,0.06))',
          'linear-gradient(135deg, rgba(124,58,237,0.2), rgba(255,255,255,0.06))',
          'linear-gradient(135deg, rgba(167,139,250,0.2), rgba(255,255,255,0.06))'
        ];
        const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
        
        return `
          <article class="project-card" 
                   data-id="${project.id}"
                   data-title="${escapeHtml(project.title)}"
                   data-tags="${escapeHtml(tagsStr)}">
            <div class="project-thumb" style="background: ${randomGradient};">
              <img src="${thumbnailSrc}" alt="${escapeHtml(project.title)}" />
            </div>
            <div class="project-body">
              <h3 class="project-title">${escapeHtml(project.title)}</h3>
              <p class="project-desc">${escapeHtml(project.description || 'Sin descripción')}</p>
              <div class="project-tags">
                ${tags.map(tag => `<span class="project-tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
              <div style="margin-top: auto; padding-top: 12px; display: flex; gap: 12px; font-size: 12px; color: rgba(255,255,255,0.5); border-top: 1px solid rgba(255,255,255,0.05);">
                <span style="display: flex; align-items: center; gap: 4px;" title="Vistas">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  ${project.views_count || 0}
                </span>
                <span style="display: flex; align-items: center; gap: 4px;" title="Descargas">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  ${project.downloads_count || 0}
                </span>
                <span style="display: flex; align-items: center; gap: 4px;" title="Likes">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                  </svg>
                  ${project.likes_count || 0}
                </span>
              </div>
            </div>
          </article>
        `;
      }).join('');
      
      // Agregar event listeners para clicks en proyectos
      document.querySelectorAll('.project-card').forEach(card => {
        card.style.cursor = 'pointer';
        card.addEventListener('click', () => {
          const projectId = card.getAttribute('data-id');
          openProjectDetail(projectId);
        });
      });
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    async function openProjectDetail(projectId) {
      const project = allProjects.find(p => p.id === projectId);
      if (!project) return;
      
      // Incrementar contador de vistas
      await supabase.rpc('increment_project_views', { project_uuid: projectId });
      
      // Abrir link de descarga en nueva pestaña
      if (project.download_link) {
        window.open(project.download_link, '_blank');
        
        // Incrementar contador de descargas
        await supabase.rpc('increment_project_downloads', { project_uuid: projectId });
      }
    }

    // Búsqueda por texto
    (function(){
      const input = document.getElementById('projectSearch');
      const grid = document.getElementById('projectsGrid');
      const empty = document.getElementById('projectsEmpty');

      function normalize(s){ return (s||'').toString().toLowerCase().trim(); }

      function applySearch(){
        const q = normalize(input.value);
        let visible = 0;
        Array.from(grid.children).forEach(card => {
          const title = normalize(card.getAttribute('data-title'));
          const tags = normalize(card.getAttribute('data-tags'));
          const show = !q || title.includes(q) || tags.includes(q);
          card.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        empty.style.display = visible ? 'none' : 'block';
      }

      input.addEventListener('input', applySearch);

      // Cargar proyectos al iniciar
      loadProjects();
    })();
  </script>
</body>
</html>
