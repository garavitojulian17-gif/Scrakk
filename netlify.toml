# Netlify config for static site using home.html as root
[build]
  publish = "."
  command = "npm install"
  functions = "netlify/functions"

# Redirect root to home.html so / loads correctly
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200

# Handle product routes with friendly URLs
[[redirects]]
  from = "/productos/*"
  to = "/producto.html"
  status = 200

# Optional: handle SPA-style routes to home.html too
[[redirects]]
  from = "/*"
  to = "/home.html"
  status = 200
