<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cubo 2D caminando (rodando) sobre suelo</title>
<style>
  :root{
    --size: 100; /* lado del cuadrado en px */
    --ground-h: 120px;
    --speed: 120; /* px por segundo */
  }

  html,body{
    height:100%;
    margin:0;
    background: linear-gradient(#9ec, #6ab);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    font-family: sans-serif;
  }

  .scene{
    width:90%;
    height: 60vh;
    max-height:600px;
    position:relative;
    overflow:hidden;
  }

  /* suelo */
  .ground{
    position: absolute;
    left:0; right:0;
    bottom:0;
    height:var(--ground-h);
    background:
      linear-gradient(0deg,#2e2 0 2px, transparent 2px 100%),
      linear-gradient(90deg,#332 0 2px, transparent 2px 100%);
    box-shadow: inset 0 10px 30px rgba(0,0,0,0.25);
  }

  /* el "cubo" (cuadrado) */
  .cube{
    --s: calc(var(--size) * 1px);
    width: var(--s);
    height: var(--s);
    position:absolute;
    left: 10px;
    /* lo colocamos tocando el suelo */
    bottom: calc(var(--ground-h));
    transform-origin: 50% calc(100% + 0px); /* pivote justo en el borde inferior */
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    background: linear-gradient(135deg,#ff8 0%, #f80 100%);
    border: 4px solid #603;
    box-shadow: 0 10px 20px rgba(0,0,0,0.35);
    will-change: transform, left;
  }

  /* cara frontal decorativa (para notar la rotación) */
  .face {
    width:80%;
    height:80%;
    display:block;
    background:
      linear-gradient(135deg, rgba(0,0,0,0.12), transparent),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.06) 0 6px, transparent 6px 12px);
    text-align:center;
    line-height: calc(var(--size) * 0.8px);
    font-weight:700;
    color:#330;
    border-radius:6px;
    user-select:none;
  }

  /* indicador de posición */
  .info{
    position:absolute;
    left:12px;
    top:12px;
    color:#052;
    font-size:14px;
    background:rgba(255,255,255,0.85);
    padding:6px 8px;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }

  /* responsive: reduce el tamaño del cubo en pantallas pequeñas */
  @media (max-width:600px){
    :root{ --size:64; --speed:90; }
  }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="info" id="info">Vel: -- px/s</div>

    <div class="cube" id="cube" aria-hidden="true">
      <span class="face" id="face">C</span>
    </div>

    <div class="ground"></div>
  </div>

<script>
/*
  Animación por JS para que la rotación coincida con el desplazamiento:
  - El cuadrado 'rueda' sin deslizar: por cada desplazamiento igual al lado,
    la rotación aumenta en 90 grados (porque un lado pasa a ser el siguiente).
  - Transform usamos translateX(y) + rotate(z) con transform-origin en el borde inferior.
*/

const cube = document.getElementById('cube');
const info = document.getElementById('info');
const scene = document.getElementById('scene');

let lastTime = null;
let x = 10; // posición inicial en px (desde left)
const side = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--size')) || 100;
const speed = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--speed')) || 120; // px/s

info.textContent = `Vel: ${Math.round(speed)} px/s`;

const sceneWidth = () => scene.clientWidth;
const maxX = () => Math.max(10, sceneWidth() - side - 10);

function step(ts){
  if (!lastTime) lastTime = ts;
  const dt = (ts - lastTime) / 1000; // segundos
  lastTime = ts;
  // mueve a la derecha; rebota y vuelve (loop back)
  x += speed * dt;
  // si se sale de la pantalla, regresa a la izquierda
  if (x > maxX()) x = 10;

  // rotación aproximada para "rodar sin deslizar":
  // por cada desplazamiento igual a 'side' --> rotación += 90deg
  const rot = (x / side) * 90; // grados
  // aplicamos la transform: primero translateX, luego rotate
  cube.style.transform = `translateX(${x}px) rotate(${rot}deg)`;

  // (opcional) ajustar sombra o pequeño bob para dar más realismo
  requestAnimationFrame(step);
}

// reinicia on resize para recalcular límites
window.addEventListener('resize', ()=>{
  // nada crítico, pero podemos forzar re-evaluación
});

requestAnimationFrame(step);
</script>
</body>
</html>
